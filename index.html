<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Semi Truck for Toddler</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Road */
        .road {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 150px;
            background: #333;
            overflow: hidden;
        }

        /* Road lines */
        .road-lines {
            position: absolute;
            top: 50%;
            left: -100px;
            width: 200%;
            height: 10px;
            transform: translateY(-50%);
        }

        .road-line {
            position: absolute;
            width: 80px;
            height: 10px;
            background: #FFF;
            animation: roadMove 2s linear infinite;
        }

        .road-line:nth-child(1) { left: -200px; }
        .road-line:nth-child(2) { left: 0px; }
        .road-line:nth-child(3) { left: 200px; }
        .road-line:nth-child(4) { left: 400px; }
        .road-line:nth-child(5) { left: 600px; }
        .road-line:nth-child(6) { left: 800px; }
        .road-line:nth-child(7) { left: 1000px; }
        .road-line:nth-child(8) { left: 1200px; }
        .road-line:nth-child(9) { left: 1400px; }
        .road-line:nth-child(10) { left: 1600px; }
        .road-line:nth-child(11) { left: 1800px; }
        .road-line:nth-child(12) { left: 2000px; }

        @keyframes roadMove {
            from { transform: translateX(0); }
            to { transform: translateX(-200px); }
        }

        /* Semi truck container */
        .truck-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 0.5s ease-in-out infinite alternate;
            width: 500px;
            height: 120px;
            z-index: 10;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-5px); }
        }

        /* Truck cab */
        .truck-cab {
            position: absolute;
            width: 140px;
            height: 120px;
            background: #FF6B6B;
            border-radius: 10px 10px 5px 5px;
            right: 0;
            bottom: 0;
        }

        /* Cab window */
        .cab-window {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #4ECDC4;
            border-radius: 5px;
        }
        
        /* Exhaust pipes */
        .exhaust {
            position: absolute;
            width: 8px;
            height: 60px;
            background: #555;
            bottom: 50px;
            left: -15px;
            border-radius: 4px;
        }
        
        .exhaust2 {
            position: absolute;
            width: 8px;
            height: 60px;
            background: #555;
            bottom: 50px;
            left: -25px;
            border-radius: 4px;
        }
        
        /* Side mirrors */
        .mirror {
            position: absolute;
            width: 15px;
            height: 20px;
            background: #333;
            top: 40px;
            left: -10px;
            border-radius: 50% 0 0 50%;
        }
        
        /* Door line */
        .door-line {
            position: absolute;
            width: 2px;
            height: 80px;
            background: #E55555;
            left: 50px;
            top: 20px;
        }
        
        /* Side step */
        .side-step {
            position: absolute;
            width: 30px;
            height: 8px;
            background: #666;
            left: 40px;
            bottom: 5px;
            border-radius: 2px;
        }

        /* Trailer */
        .trailer {
            position: absolute;
            width: 340px;
            height: 120px;
            background: #FFE66D;
            top: 0;
            left: 0;
            border-radius: 5px;
        }

        /* Trailer stripes */
        .trailer-stripe {
            position: absolute;
            width: 100%;
            height: 20px;
            background: #FF6B6B;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Trailer text */
        .trailer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            font-size: 48px;
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 0px #FFF;
            letter-spacing: 4px;
        }

        /* Wheels */
        .wheel {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #333;
            border-radius: 50%;
            bottom: -22px;
            border: 5px solid #666;
            animation: wheelRotate 1s linear infinite;
        }
        
        /* Dual wheels (shown as single wider wheel in 2D) */
        .wheel-dual {
            width: 40px;
            border-width: 6px;
        }

        .wheel::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes wheelRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Front tractor wheels (2) */
        .wheel1 { right: 100px; }
        
        /* Rear tractor wheels (4 dual sets = 8 wheels, shown as 4 in 2D) */
        .wheel2 { right: 50px; }
        .wheel3 { right: 10px; }
        
        /* Trailer wheels (4 dual sets = 8 wheels, shown as 4 in 2D) */
        .wheel4 { left: 50px; }
        .wheel5 { left: 120px; }
        .wheel6 { left: 190px; }
        .wheel7 { left: 260px; }

        /* Clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 20%;
            left: -100px;
            animation: cloudMove 20s linear infinite;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 80px;
            height: 35px;
            top: 10%;
            left: -80px;
            animation: cloudMove 25s linear infinite;
            animation-delay: 5s;
        }

        .cloud2::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 15px;
        }

        .cloud2::after {
            width: 50px;
            height: 35px;
            top: -10px;
            right: 15px;
        }
        
        .cloud3 {
            width: 90px;
            height: 38px;
            top: 30%;
            left: -90px;
            animation: cloudMove 30s linear infinite;
            animation-delay: 10s;
        }

        .cloud3::before {
            width: 45px;
            height: 45px;
            top: -22px;
            left: 12px;
        }

        .cloud3::after {
            width: 55px;
            height: 38px;
            top: -12px;
            right: 12px;
        }

        @keyframes cloudMove {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        /* Sun */
        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #FFD93D;
            border-radius: 50%;
            top: 50px;
            right: 50px;
            box-shadow: 0 0 50px #FFD93D;
        }

        /* Title */
        h1 {
            text-align: center;
            color: #333;
            font-family: Arial, sans-serif;
            margin-top: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Click message */
        .click-message {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            color: #333;
            cursor: pointer;
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 20px;
        }

        /* Birds */
        .bird {
            position: absolute;
            font-size: 20px;
            color: #333;
            animation: birdFly 15s linear infinite;
            left: 100%;
        }
        
        .bird1 {
            top: 15%;
            animation-delay: 0s;
            animation-duration: 18s;
        }
        
        .bird2 {
            top: 25%;
            animation-delay: 3s;
            animation-duration: 20s;
        }
        
        .bird3 {
            top: 8%;
            animation-delay: 7s;
            animation-duration: 16s;
        }
        
        @keyframes birdFly {
            from {
                left: 100%;
                transform: rotate(55deg) scaleX(-1) translateY(0);
            }
            25% {
                transform: rotate(55deg) scaleX(-1) translateY(-10px);
            }
            50% {
                transform: rotate(55deg) scaleX(-1) translateY(5px);
            }
            75% {
                transform: rotate(55deg) scaleX(-1) translateY(-5px);
            }
            to {
                left: -50px;
                transform: rotate(55deg) scaleX(-1) translateY(0);
            }
        }
        
        /* Trees */
        .tree {
            position: absolute;
            bottom: 250px;
            width: 60px;
            animation: treeMove 10s linear infinite;
            z-index: 1;
            left: 100%;
        }
        
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 40px;
            background: #8B4513;
            border-radius: 2px;
        }
        
        .tree-leaves {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid #228B22;
        }
        
        .tree-leaves::after {
            content: '';
            position: absolute;
            top: 25px;
            left: -25px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 35px solid #228B22;
        }
        
        .tree1 { animation-delay: 0s; }
        .tree2 { animation-delay: 2.5s; }
        .tree3 { animation-delay: 5s; }
        .tree4 { animation-delay: 7.5s; }
        
        @keyframes treeMove {
            from { left: 100%; }
            to { left: -100px; }
        }
        
        /* Honk effect */
        .honk {
            position: absolute;
            font-size: 3em;
            font-weight: bold;
            color: #FF6B6B;
            animation: honkAnimation 1s ease-out forwards;
            pointer-events: none;
            z-index: 40;
        }

        @keyframes honkAnimation {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg) translateY(-100px);
                opacity: 0;
            }
        }

        /* Instructions bubble */
        .instructions {
            position: absolute;
            left: 30px;
            top: 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 26px 30px;
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.94), rgba(255, 223, 138, 0.95));
            border-radius: 36px;
            border: 4px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.18);
            color: #4d2f13;
            font-family: 'Baloo 2', 'Comic Sans MS', sans-serif;
            z-index: 20;
            max-width: 320px;
        }

        .instructions-title {
            font-size: 0.9em;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #d45a00;
        }

        .instructions-item {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 1.4em;
            font-weight: 600;
        }

        .instructions-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe082, #ffca28);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(255, 255, 255, 0.6), inset 0 -6px 10px rgba(214, 140, 0, 0.35);
            font-size: 1.8em;
        }

        .instructions-text {
            flex: 1;
            line-height: 1.1;
        }

        @media (max-width: 600px) {
            .instructions {
                left: 50%;
                top: 18px;
                transform: translateX(-50%);
                max-width: 85vw;
                text-align: left;
                gap: 12px;
            }
        }


        .lights-on .truck-cab {
            box-shadow: 0 0 30px rgba(255, 255, 150, 0.5);
        }

        .lights-on .truck-cab::after {
            content: '';
            position: absolute;
            right: -130px;
            bottom: 15px;
            width: 130px;
            height: 60px;
            background: linear-gradient(90deg, rgba(255, 255, 200, 0.55), rgba(255, 255, 200, 0));
            clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%);
            filter: blur(2px);
        }

        .lights-on .cab-window {
            background: linear-gradient(180deg, #FFFDE7, #FFE082);
        }
    </style>
</head>
<body>
    <h1>HONK HONK! Big Rig Coming Through!</h1>
    
    <div class="sun"></div>
    
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    
    <div class="bird bird1">🕊️</div>
    <div class="bird bird2">🕊️</div>
    <div class="bird bird3">🕊️</div>
    
    <!-- Trees in background -->
    <div class="tree tree1">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree2">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree3">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree4">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    
    <div class="road">
        <div class="road-lines">
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
        </div>
    </div>
    
    <div class="truck-container" id="truck">
        <div class="trailer">
            <div class="trailer-stripe"></div>
            <div class="trailer-text">DANIEL</div>
        </div>
        <div class="truck-cab">
            <div class="cab-window"></div>
            <div class="exhaust"></div>
            <div class="exhaust2"></div>
            <div class="mirror"></div>
            <div class="door-line"></div>
            <div class="side-step"></div>
        </div>
        <!-- Front tractor wheel (1 single) -->
        <div class="wheel wheel1"></div>
        
        <!-- Rear tractor wheels (2 dual sets shown as 2 wheels) -->
        <div class="wheel wheel-dual wheel2"></div>
        <div class="wheel wheel-dual wheel3"></div>
        
        <!-- Trailer wheels (4 dual sets shown as 4 wheels) -->
        <div class="wheel wheel-dual wheel4"></div>
        <div class="wheel wheel-dual wheel5"></div>
        <div class="wheel wheel-dual wheel6"></div>
        <div class="wheel wheel-dual wheel7"></div>
    </div>
    
    <div class="instructions" role="note">
        <span class="instructions-title">Play Tips</span>
        <div class="instructions-item">
            <span class="instructions-icon" aria-hidden="true">🚛</span>
            <span class="instructions-text">Click for HONK!</span>
        </div>
        <div class="instructions-item">
            <span class="instructions-icon" aria-hidden="true">🎺</span>
            <span class="instructions-text">Right-click for TOOT!</span>
        </div>
        <div class="instructions-item">
            <span class="instructions-icon" aria-hidden="true">✨</span>
            <span class="instructions-text">Press "L" to toggle lights</span>
        </div>
    </div>
    
    
    <script>
        // Create audio context for honk sound
        let audioContext = null;
        
        function ensureAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {
                    /* Gracefully ignore resume failures */
                });
            }
            return audioContext;
        }
        
        function playHonk(preset = 'classic') {
            const context = ensureAudioContext();
            const now = context.currentTime;
            
            const settings = {
                classic: [220, 275, 330],
                buddy: [330, 392, 494]
            };
            const frequencies = settings[preset] || settings.classic;
            
            const oscillators = frequencies.map(() => context.createOscillator());
            const gainNode = context.createGain();
            const filter = context.createBiquadFilter();
            const vibrato = context.createOscillator();
            const vibratoGain = context.createGain();
            
            oscillators.forEach((oscillator, index) => {
                oscillator.frequency.setValueAtTime(frequencies[index], now);
                oscillator.type = index === 1 ? 'square' : 'sawtooth';
                oscillator.connect(filter);
            });
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.connect(gainNode);
            gainNode.connect(context.destination);
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.45, now + 0.05);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.3);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            
            vibrato.frequency.value = 5;
            vibratoGain.gain.value = preset === 'buddy' ? 5 : 3;
            vibrato.connect(vibratoGain);
            oscillators.forEach((oscillator) => {
                vibratoGain.connect(oscillator.frequency);
            });
            
            oscillators.forEach((oscillator) => oscillator.start(now));
            vibrato.start(now);
            
            oscillators.forEach((oscillator) => oscillator.stop(now + 0.8));
            vibrato.stop(now + 0.8);
        }
        
        function addHonkBurst(positionX, positionY, text = 'HONK!') {
            const honk = document.createElement('div');
            honk.className = 'honk';
            honk.textContent = text;
            honk.style.left = positionX + 'px';
            honk.style.top = positionY + 'px';
            document.body.appendChild(honk);
            
            setTimeout(() => {
                honk.remove();
            }, 1000);
        }
        
        function bounceTruck() {
            const truck = document.getElementById('truck');
            if (!truck) {
                return;
            }
            truck.style.animation = 'none';
            setTimeout(() => {
                truck.style.animation = 'bounce 0.5s ease-in-out infinite alternate';
            }, 10);
        }
        
        function handleHonk(event, options = {}) {
            const clickX = options.x ?? event?.clientX ?? window.innerWidth / 2;
            const clickY = options.y ?? event?.clientY ?? window.innerHeight / 2;
            const text = options.text || 'HONK!';
            const preset = options.preset || 'classic';
            playHonk(preset);
            addHonkBurst(clickX, clickY, text);
            bounceTruck();
        }
        
        function toggleLights() {
            const truck = document.getElementById('truck');
            if (!truck) {
                return;
            }
            truck.classList.toggle('lights-on');
        }
        
        document.body.addEventListener('click', (event) => {
            handleHonk(event, {
                preset: 'classic',
                text: 'HONK!'
            });
        });
        
        document.body.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            handleHonk(event, {
                preset: 'buddy',
                text: 'TOOT!'
            });
        });
        
        document.addEventListener('keydown', (event) => {
            if (event.key && event.key.toLowerCase() === 'l') {
                event.preventDefault();
                toggleLights();
            }
        });
    </script>
</body>
</html>
