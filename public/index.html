<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Semi Truck for Toddler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>HONK HONK! Big Rig Coming Through!</h1>
    
    <div class="sun" role="button" tabindex="0" aria-label="Toggle night mode">
        <div class="crater crater1"></div>
        <div class="crater crater2"></div>
        <div class="crater crater3"></div>
        <div class="crater crater4"></div>
        <div class="crater crater5"></div>
    </div>

    <div class="stars" aria-hidden="true">
        <div class="star" style="top: 8%; left: 5%;"></div>
        <div class="star" style="top: 15%; left: 12%;"></div>
        <div class="star" style="top: 5%; left: 20%;"></div>
        <div class="star" style="top: 22%; left: 25%;"></div>
        <div class="star" style="top: 10%; left: 35%;"></div>
        <div class="star" style="top: 18%; left: 42%;"></div>
        <div class="star" style="top: 6%; left: 48%;"></div>
        <div class="star" style="top: 25%; left: 55%;"></div>
        <div class="star" style="top: 12%; left: 62%;"></div>
        <div class="star" style="top: 20%; left: 70%;"></div>
        <div class="star" style="top: 8%; left: 78%;"></div>
        <div class="star" style="top: 30%; left: 15%;"></div>
        <div class="star" style="top: 35%; left: 30%;"></div>
        <div class="star" style="top: 28%; left: 45%;"></div>
        <div class="star" style="top: 38%; left: 60%;"></div>
        <div class="star" style="top: 32%; left: 75%;"></div>
        <div class="star" style="top: 42%; left: 8%;"></div>
        <div class="star" style="top: 45%; left: 22%;"></div>
        <div class="star" style="top: 40%; left: 38%;"></div>
        <div class="star" style="top: 48%; left: 52%;"></div>
        <div class="star" style="top: 44%; left: 68%;"></div>
        <div class="star" style="top: 50%; left: 82%;"></div>
        <div class="star" style="top: 55%; left: 10%;"></div>
        <div class="star" style="top: 52%; left: 28%;"></div>
        <div class="star" style="top: 58%; left: 40%;"></div>
        <div class="star" style="top: 54%; left: 58%;"></div>
        <div class="star" style="top: 60%; left: 72%;"></div>
        <div class="star" style="top: 3%; left: 88%;"></div>
        <div class="star" style="top: 15%; left: 92%;"></div>
        <div class="star" style="top: 35%; left: 85%;"></div>
    </div>
    
    <div class="cloud cloud1" aria-hidden="true"></div>
    <div class="cloud cloud2" aria-hidden="true"></div>
    <div class="cloud cloud3" aria-hidden="true"></div>
    
    <div class="bird bird1" aria-hidden="true"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="bird bird2" aria-hidden="true"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="bird bird3" aria-hidden="true"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="ufo" aria-hidden="true"><span class="day-flyer">🛩️</span><span class="night-flyer">🛸</span></div>
    
    <!-- Trees in background -->
    <div class="tree tree1" aria-hidden="true">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree2" aria-hidden="true">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree3" aria-hidden="true">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree4" aria-hidden="true">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    
    <div class="road">
        <div class="road-lines"></div>
    </div>
    
    <div class="vehicle-container" id="vehicle-container">
        <!-- Semi Truck -->
        <div class="vehicle vehicle-semi" id="vehicle-semi" role="button" tabindex="0" aria-label="Semi truck - tap to honk">
            <div class="semi-trailer">
                <div class="semi-trailer-stripe"></div>
                <div class="semi-trailer-text" id="trailer-text">BIG RIG</div>
            </div>
            <div class="semi-cab">
                <div class="semi-window"></div>
                <div class="semi-exhaust"></div>
                <div class="semi-exhaust2"></div>
                <div class="semi-mirror"></div>
                <div class="semi-door-line"></div>
                <div class="semi-side-step"></div>
                <div class="semi-headlight semi-headlight-top"></div>
                <div class="semi-headlight semi-headlight-bottom"></div>
                <div class="semi-headlight-beam"></div>
            </div>
            <div class="semi-wheel semi-wheel1"></div>
            <div class="semi-wheel semi-wheel2"></div>
            <div class="semi-wheel semi-wheel3"></div>
            <div class="semi-wheel semi-wheel4"></div>
            <div class="semi-wheel semi-wheel5"></div>
            <div class="semi-wheel semi-wheel6"></div>
            <div class="semi-wheel semi-wheel7"></div>
        </div>

        <!-- Garbage Truck -->
        <div class="vehicle vehicle-garbage" id="vehicle-garbage" role="button" tabindex="0" aria-label="Garbage truck - tap to honk">
            <div class="garbage-body">
                <div class="garbage-body-stripe"></div>
                <div class="garbage-body-text">TRASH CO</div>
            </div>
            <div class="garbage-cab">
                <div class="garbage-window"></div>
            </div>
            <div class="garbage-wheel garbage-wheel1"></div>
            <div class="garbage-wheel garbage-wheel2"></div>
            <div class="garbage-wheel garbage-wheel3"></div>
        </div>

        <!-- Cybertruck -->
        <div class="vehicle vehicle-cybertruck" id="vehicle-cybertruck" role="button" tabindex="0" aria-label="Cybertruck - tap to honk">
            <div class="cybertruck-top">
                <div class="cybertruck-window"></div>
                <div class="cybertruck-break cybertruck-break-1"></div>
                <div class="cybertruck-break cybertruck-break-2"></div>
            </div>
            <div class="cybertruck-middle"></div>
            <div class="cybertruck-wheel cybertruck-wheel-left"></div>
            <div class="cybertruck-wheel cybertruck-wheel-right"></div>
            <div class="cybertruck-tire cybertruck-tire-left"></div>
            <div class="cybertruck-tire cybertruck-tire-right"></div>
        </div>
    </div>
    
    <div class="instructions" role="note" id="instructions">
        <div class="instructions-header" id="instructions-header">
            <span class="instructions-title">Play Tips</span>
            <button class="instructions-toggle" id="instructions-toggle" aria-label="Toggle instructions" aria-expanded="true">▼</button>
        </div>
        <div class="instructions-content">
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🚛</span>
                <span class="instructions-text"><span class="desktop-only">Press "H"</span><span class="touch-only">Tap cab</span> for HONK!</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🎺</span>
                <span class="instructions-text"><span class="desktop-only">Press "J"</span><span class="touch-only">Tap trailer</span> for TOOT!</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">✨</span>
                <span class="instructions-text"><span class="desktop-only">Press "L"</span><span class="touch-only">Tap headlights</span> to toggle lights</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🌙</span>
                <span class="instructions-text"><span class="desktop-only">Press "N"</span><span class="touch-only">Tap sun/moon</span> for night mode</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">✏️</span>
                <span class="instructions-text">Click name to change</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🚗</span>
                <span class="instructions-text"><span class="desktop-only">Press "V"</span><span class="touch-only">Tap icons</span> to switch vehicle</span>
            </div>
        </div>
    </div>

    <!-- Vehicle selector -->
    <div class="vehicle-selector" id="vehicle-selector" role="group" aria-label="Choose a vehicle">
        <!-- Populated by JavaScript -->
    </div>

    <!-- Custom name input modal -->
    <div class="modal-overlay" id="name-modal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
            <label class="modal-title" id="name-modal-title" for="name-input">Enter a name for the truck:</label>
            <input type="text" class="modal-input" id="name-input" maxlength="12" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel">Cancel</button>
                <button class="modal-btn modal-btn-ok" id="modal-ok">OK</button>
            </div>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
