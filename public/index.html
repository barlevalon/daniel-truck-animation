<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Semi Truck for Toddler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>HONK HONK! Big Rig Coming Through!</h1>
    
    <div class="sun">
        <div class="crater crater1"></div>
        <div class="crater crater2"></div>
        <div class="crater crater3"></div>
        <div class="crater crater4"></div>
        <div class="crater crater5"></div>
    </div>

    <div class="stars">
        <div class="star" style="top: 8%; left: 5%;"></div>
        <div class="star" style="top: 15%; left: 12%;"></div>
        <div class="star" style="top: 5%; left: 20%;"></div>
        <div class="star" style="top: 22%; left: 25%;"></div>
        <div class="star" style="top: 10%; left: 35%;"></div>
        <div class="star" style="top: 18%; left: 42%;"></div>
        <div class="star" style="top: 6%; left: 48%;"></div>
        <div class="star" style="top: 25%; left: 55%;"></div>
        <div class="star" style="top: 12%; left: 62%;"></div>
        <div class="star" style="top: 20%; left: 70%;"></div>
        <div class="star" style="top: 8%; left: 78%;"></div>
        <div class="star" style="top: 30%; left: 15%;"></div>
        <div class="star" style="top: 35%; left: 30%;"></div>
        <div class="star" style="top: 28%; left: 45%;"></div>
        <div class="star" style="top: 38%; left: 60%;"></div>
        <div class="star" style="top: 32%; left: 75%;"></div>
        <div class="star" style="top: 42%; left: 8%;"></div>
        <div class="star" style="top: 45%; left: 22%;"></div>
        <div class="star" style="top: 40%; left: 38%;"></div>
        <div class="star" style="top: 48%; left: 52%;"></div>
        <div class="star" style="top: 44%; left: 68%;"></div>
        <div class="star" style="top: 50%; left: 82%;"></div>
        <div class="star" style="top: 55%; left: 10%;"></div>
        <div class="star" style="top: 52%; left: 28%;"></div>
        <div class="star" style="top: 58%; left: 40%;"></div>
        <div class="star" style="top: 54%; left: 58%;"></div>
        <div class="star" style="top: 60%; left: 72%;"></div>
        <div class="star" style="top: 3%; left: 88%;"></div>
        <div class="star" style="top: 15%; left: 92%;"></div>
        <div class="star" style="top: 35%; left: 85%;"></div>
    </div>
    
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    
    <div class="bird bird1"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="bird bird2"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="bird bird3"><span class="day-flyer">🕊️</span><span class="night-flyer">🦇</span></div>
    <div class="ufo"><span class="day-flyer">🛩️</span><span class="night-flyer">🛸</span></div>
    
    <!-- Trees in background -->
    <div class="tree tree1">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree2">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree3">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    <div class="tree tree4">
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
    </div>
    
    <div class="road">
        <div class="road-lines">
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
        </div>
    </div>
    
    <div class="truck-container" id="truck">
        <div class="trailer" id="trailer">
            <div class="trailer-stripe"></div>
            <div class="trailer-text" id="trailer-text">DANIEL</div>
        </div>
        <div class="truck-cab" id="truck-cab">
            <div class="cab-window"></div>
            <div class="exhaust"></div>
            <div class="exhaust2"></div>
            <div class="mirror"></div>
            <div class="door-line"></div>
            <div class="side-step"></div>
            <div class="headlight headlight-top"></div>
            <div class="headlight headlight-bottom"></div>
            <div class="headlight-beam"></div>
        </div>
        <!-- Front tractor wheel (1 single) -->
        <div class="wheel wheel1"></div>
        
        <!-- Rear tractor wheels (2 dual sets shown as 2 wheels) -->
        <div class="wheel wheel-dual wheel2"></div>
        <div class="wheel wheel-dual wheel3"></div>
        
        <!-- Trailer wheels (4 dual sets shown as 4 wheels) -->
        <div class="wheel wheel-dual wheel4"></div>
        <div class="wheel wheel-dual wheel5"></div>
        <div class="wheel wheel-dual wheel6"></div>
        <div class="wheel wheel-dual wheel7"></div>
    </div>
    
    <div class="instructions" role="note" id="instructions">
        <div class="instructions-header">
            <span class="instructions-title">Play Tips</span>
            <button class="instructions-toggle" id="instructions-toggle" aria-label="Toggle instructions">▼</button>
        </div>
        <div class="instructions-content">
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🚛</span>
                <span class="instructions-text"><span class="desktop-only">Press "H"</span><span class="touch-only">Tap cab</span> for HONK!</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🎺</span>
                <span class="instructions-text"><span class="desktop-only">Press "J"</span><span class="touch-only">Tap trailer</span> for TOOT!</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">✨</span>
                <span class="instructions-text"><span class="desktop-only">Press "L"</span><span class="touch-only">Tap headlights</span> to toggle lights</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">🌙</span>
                <span class="instructions-text"><span class="desktop-only">Press "N"</span><span class="touch-only">Tap sun/moon</span> for night mode</span>
            </div>
            <div class="instructions-item">
                <span class="instructions-icon" aria-hidden="true">✏️</span>
                <span class="instructions-text">Click name to change</span>
            </div>
        </div>
    </div>

    <!-- Custom name input modal -->
    <div class="modal-overlay" id="name-modal">
        <div class="modal">
            <div class="modal-title">Enter a name for the truck:</div>
            <input type="text" class="modal-input" id="name-input" maxlength="12" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel">Cancel</button>
                <button class="modal-btn modal-btn-ok" id="modal-ok">OK</button>
            </div>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
